<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerndoelenbingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root {
  --paars: #92278F;
  --donker: #57257C;
  --blauw: #7598C0;
  --blauw-tekst: #3D5F87;   /* blauw donker genoeg voor tekst (6,4:1) */
  --inkt: #1F1A24;
  --grijs: #5A5560;          /* 7:1 op wit */
  --lijn: #D9D4DE;
  --vlak: #F6F3F8;
  --wit: #FFFFFF;
  --goed: #1F6B3A;
  --fout: #A3231F;
  --focus: #1D4ED8;
  --r: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--wit); }
body {
  margin: 0; background: var(--wit); color: var(--inkt);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 18px; line-height: 1.45;
}
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; background: var(--donker); color: #fff; padding: 10px 14px; border-radius: var(--r); z-index: 10; }
.skip:focus { top: 12px; }
[hidden] { display: none !important; }

/* knoppen */
.btn {
  min-height: 48px; padding: 10px 18px; border-radius: var(--r);
  border: 2px solid var(--paars); background: var(--wit); color: var(--paars);
  font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { background: var(--vlak); }
.btn.primair { background: var(--paars); color: #fff; }
.btn.primair:hover { background: var(--donker); border-color: var(--donker); }
.btn.groot { min-height: 64px; font-size: 24px; padding: 12px 28px; }
.btn.stil { border-color: var(--lijn); color: var(--inkt); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn[aria-pressed="true"].ja { background: var(--goed); border-color: var(--goed); color: #fff; }
.btn[aria-pressed="true"].nee { background: var(--fout); border-color: var(--fout); color: #fff; }
.icoon { width: 22px; height: 22px; flex: none; }

.wrap { max-width: 1440px; margin: 0 auto; padding: 16px; }
.kop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--lijn); }
.kop h1 { font-size: 22px; color: var(--donker); }
.rij { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* domeinlabels: kleur + tekst, nooit alleen kleur */
.dom { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 2px solid currentColor; }
.dom::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: currentColor; }
.d-Communicatie { color: var(--paars); }
.d-Taal { color: var(--donker); }
.d-Taal::before { border-radius: 50%; }
.d-Literatuur { color: var(--blauw-tekst); }
.d-Literatuur::before { transform: rotate(45deg); }

/* keuzescherm */
.keuze { min-height: 100vh; display: grid; place-content: center; gap: 24px; text-align: center; padding: 16px; }
.keuze h1 { font-size: clamp(36px, 7vw, 64px); color: var(--donker); }
.keuze .rij { justify-content: center; }
.keuze a.btn { text-decoration: none; min-width: 240px; }

/* trainer */
.tr-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: 24px; padding-top: 20px; }
@media (max-width: 900px) { .tr-grid { grid-template-columns: minmax(0, 1fr); } }
.bal { border: 2px solid var(--lijn); border-radius: 18px; padding: clamp(20px, 4vw, 48px); min-height: 380px; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.bal-code { font-size: clamp(56px, 9vw, 120px); font-weight: 700; line-height: 1; color: var(--paars); font-variant-numeric: tabular-nums; }
.bal-titel { font-size: clamp(36px, 4.4vw, 60px); line-height: 1.1; font-weight: 700; color: var(--inkt); }
.bal-zin { font-size: clamp(22px, 2.2vw, 32px); color: var(--inkt); max-width: 34ch; }
.bal-ouder { font-size: 20px; color: var(--grijs); }
.bal.leeg .bal-titel { color: var(--grijs); font-weight: 400; }
.teller { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.klok { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--donker); }
.paneel { border: 1px solid var(--lijn); border-radius: 14px; padding: 16px; }
.paneel + .paneel { margin-top: 16px; }
.paneel h2 { font-size: 18px; color: var(--donker); margin-bottom: 10px; }
.samenhang { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.samenhang h3 { font-size: 15px; margin-bottom: 6px; }
.slot { border: 2px dashed var(--lijn); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; font-size: 15px; line-height: 1.25; color: var(--grijs); min-height: 54px; }
.slot b { display: block; font-size: 18px; }
.slot.getrokken { border-style: solid; border-color: currentColor; color: var(--inkt); background: var(--vlak); }
.slot.nu { outline: 3px solid var(--paars); outline-offset: 1px; }
.lijst { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 16px; }
.lijst li { display: flex; gap: 8px; }
.lijst .nr { color: var(--grijs); min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.leeg-tekst { color: var(--grijs); font-size: 16px; }

/* dialogen */
dialog { border: none; border-radius: 16px; padding: 0; width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 24px); color: var(--inkt); }
dialog::backdrop { background: rgba(31, 26, 36, .55); }
.dlg { padding: 24px; display: grid; gap: 16px; }
.dlg h2 { font-size: 28px; color: var(--donker); }
.dlg-kop { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sluit { min-width: 48px; min-height: 48px; border: none; background: none; cursor: pointer; border-radius: var(--r); }
.check-rij { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--lijn); }
.check-rij span { flex: 1 1 120px; font-weight: 700; }
.status { font-weight: 700; min-height: 1.5em; }
.status.goed { color: var(--goed); }
.status.fout { color: var(--fout); }
label { font-weight: 700; display: block; }
.veld { width: 100%; min-height: 48px; padding: 10px 12px; border: 2px solid var(--grijs); border-radius: var(--r); background: #fff; }
.veld:focus-visible { outline-offset: 1px; }
textarea.veld { min-height: 96px; resize: vertical; }
.hulp { font-size: 15px; color: var(--grijs); font-weight: 400; }
.fout-tekst { color: var(--fout); font-size: 16px; font-weight: 700; }
fieldset { border: 1px solid var(--lijn); border-radius: var(--r); padding: 10px 14px; margin: 0; }
legend { font-weight: 700; padding: 0 6px; }
.optie { display: flex; gap: 10px; align-items: flex-start; padding: 8px 4px; font-weight: 400; cursor: pointer; border-radius: 8px; }
.optie:hover { background: var(--vlak); }
.optie input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--paars); }
.optie.uit { color: var(--grijs); cursor: not-allowed; }
.winnaar { text-align: center; padding: 48px 24px; display: grid; gap: 20px; }
.winnaar .groot-woord { font-size: clamp(48px, 10vw, 112px); font-weight: 700; color: var(--paars); line-height: 1; }
.winnaar .naam { font-size: clamp(32px, 6vw, 64px); font-weight: 700; color: var(--donker); }

/* team */
.team { max-width: 560px; margin: 0 auto; padding: 16px; }
.stap { color: var(--grijs); font-size: 16px; font-weight: 700; }
.team h1 { font-size: 28px; color: var(--donker); margin: 4px 0 12px; }
.formulier { display: grid; gap: 16px; }
.boeken-invoer { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.boeken-invoer label { font-size: 14px; color: var(--grijs); }
.boeken-invoer .veld { padding: 8px; font-size: 16px; }
.kaart { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.vak {
  aspect-ratio: 1 / 1.08; border: 2px solid var(--lijn); border-radius: 12px; background: var(--wit);
  padding: 8px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; cursor: pointer;
  font-size: 15px; line-height: 1.2; overflow: hidden; min-height: 96px;
}
.vak:hover { border-color: var(--paars); }
.vak .titel { font-weight: 700; overflow-wrap: anywhere; }
.vak .open { color: var(--grijs); font-size: 14px; }
.vak.gemarkeerd { background: var(--paars); border-color: var(--paars); color: #fff; }
.vak.gemarkeerd .code { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.vak.gemarkeerd .dnaam { font-size: 13px; }
.bingo-boek { border: 1px solid var(--lijn); border-radius: 12px; padding: 12px; display: grid; gap: 4px; }
.bingo-boek .bt { font-size: 22px; font-weight: 700; }
.bingo-kop { font-size: clamp(56px, 16vw, 96px); font-weight: 700; color: var(--paars); line-height: 1; text-align: center; }
.kd-lijst { max-height: 38vh; overflow: auto; border: 1px solid var(--lijn); border-radius: var(--r); padding: 6px; }
.kd-lijst h3 { font-size: 15px; margin: 8px 4px 2px; }
details summary { cursor: pointer; padding: 8px 4px; font-weight: 700; min-height: 44px; }

@media (prefers-reduced-motion: no-preference) {
  .bal-code.rolt { animation: pulse .12s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
}
</style>
</head>
<body>
<a class="skip" href="#inhoud">Naar de inhoud</a>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<div id="app"></div>

<script>
// LOGIC-START
/* Bron: SLO, Kerndoelen primair onderwijs (juli 2026), leergebied Nederlands.
   Teksten letterlijk overgenomen. Kerndoel 1 (Overkoepelend) is een opdracht
   aan de school, niet aan de leerling, en zit daarom niet in de bingo. */
var KERNDOELEN = [
  { code: "2A", domein: "Communicatie", kerndoel: "De leerling begrijpt teksten.", titel: "Luisteren en lezen met begrip", doelzin: "De leerling toont begrip van zakelijke en literaire teksten.", bouw: ["ob","bb"] },
  { code: "2B", domein: "Communicatie", kerndoel: "De leerling begrijpt teksten.", titel: "Luisteren en lezen met diep begrip", doelzin: "De leerling evalueert en reflecteert op zakelijke en literaire teksten.", bouw: ["ob","bb"] },
  { code: "2C", domein: "Communicatie", kerndoel: "De leerling begrijpt teksten.", titel: "Bronnen verkennen", doelzin: "De leerling verkent de betrouwbaarheid van verschillende bronnen.", bouw: ["ob","bb"] },
  { code: "3A", domein: "Communicatie", kerndoel: "De leerling produceert teksten.", titel: "Doelgericht spreken en schrijven", doelzin: "De leerling spreekt en schrijft afgestemd op doel, publiek en context.", bouw: ["ob","bb"] },
  { code: "3B", domein: "Communicatie", kerndoel: "De leerling produceert teksten.", titel: "Creatief taal gebruiken", doelzin: "De leerling gebruikt taal op een creatieve manier.", bouw: ["ob","bb"] },
  { code: "3C", domein: "Communicatie", kerndoel: "De leerling produceert teksten.", titel: "Schrijven om te leren", doelzin: "De leerling schrijft om tot kennisopbouw of begrip te komen.", bouw: ["ob","bb"] },
  { code: "4A", domein: "Communicatie", kerndoel: "De leerling voert gesprekken.", titel: "Doelgericht gesprekken voeren", doelzin: "De leerling voert gesprekken afgestemd op doel, gesprekspartner(s) en context.", bouw: ["ob","bb"] },
  { code: "4B", domein: "Communicatie", kerndoel: "De leerling voert gesprekken.", titel: "Gesprekken voeren om te leren", doelzin: "De leerling voert gesprekken om tot kennisopbouw, begrip of een aanpak te komen.", bouw: ["ob","bb"] },
  { code: "5A", domein: "Communicatie", kerndoel: "De leerling ontwikkelt zich als bewuste taalgebruiker.", titel: "Reflecteren op taalactiviteiten", doelzin: "De leerling reflecteert op het proces en evalueert het product van een taalactiviteit.", bouw: ["ob","bb"] },
  { code: "6A", domein: "Taal", kerndoel: "De leerling toont inzicht in taal als systeem.", titel: "Vorm en betekenis beschouwen", doelzin: "De leerling beschouwt de relatie tussen vorm en betekenis van taal.", bouw: ["ob","bb"] },
  { code: "6B", domein: "Taal", kerndoel: "De leerling toont inzicht in taal als systeem.", titel: "Spelling, formulering en interpunctie", doelzin: "De leerling toont inzicht in regels en procedures voor spelling, formulering en interpunctie.", bouw: ["ob","bb"] },
  { code: "7A", domein: "Taal", kerndoel: "De leerling verkent het gebruik van taal.", titel: "Talige identiteit", doelzin: "De leerling verkent hoe je met taal uiting geeft aan identiteit.", bouw: ["ob","bb"] },
  { code: "7B", domein: "Taal", kerndoel: "De leerling verkent het gebruik van taal.", titel: "Taalvariatie en taalverandering", doelzin: "De leerling verkent taalvariatie en taalverandering in het Nederlandse taalgebied.", bouw: ["ob","bb"] },
  { code: "8A", domein: "Literatuur", kerndoel: "De leerling doet ervaring op met literatuur.", titel: "Leesvoorkeur", doelzin: "De leerling ontwikkelt een eigen leesvoorkeur.", bouw: ["ob","bb"] },
  { code: "8B", domein: "Literatuur", kerndoel: "De leerling doet ervaring op met literatuur.", titel: "Waarde van literatuur", doelzin: "De leerling verkent de waarde van literatuur.", bouw: ["ob","bb"] },
  { code: "9A", domein: "Literatuur", kerndoel: "De leerling toont inzicht in literatuur.", titel: "Verhalende teksten", doelzin: "De leerling toont inzicht in verhalende teksten.", bouw: ["ob","bb"] },
  { code: "9B", domein: "Literatuur", kerndoel: "De leerling toont inzicht in literatuur.", titel: "Literaire genres", doelzin: "De leerling toont inzicht in genrekenmerken van literatuur.", bouw: ["ob","bb"] }
];
var DOMEINEN = ["Communicatie", "Taal", "Literatuur"];
// Standaardpool: drie per domein, zodat elke rij op de kaart de samenhang kan laten zien.
var STANDAARD_POOL = ["2A", "2B", "3B", "6A", "7A", "7B", "8B", "9A", "9B"];
var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var PREFIX = "Een kind leert hiermee ";

function kd(code) { for (var i = 0; i < KERNDOELEN.length; i++) if (KERNDOELEN[i].code === code) return KERNDOELEN[i]; return null; }

// Trek een willekeurige bal uit de nog niet getrokken pool. Puur: geeft nieuwe lijst terug.
function drawBall(pool, drawn, rnd) {
  var rest = pool.filter(function (c) { return drawn.indexOf(c) === -1; });
  if (!rest.length) return null;
  var ball = rest[Math.floor((rnd || Math.random)() * rest.length)];
  return { ball: ball, drawn: drawn.concat([ball]) };
}

function emptyCard() { return [null, null, null, null, null, null, null, null, null]; }

// Markeer vakje index met kerndoel + onderbouwing. Elk boek en elk kerndoel maar één keer.
function markSquare(card, index, code, reason) {
  if (index < 0 || index > 8) return { ok: false, error: "Onbekend vakje." };
  if (card[index]) return { ok: false, error: "Dit boek is al gebruikt." };
  if (!kd(code)) return { ok: false, error: "Kies een kerndoel." };
  for (var i = 0; i < card.length; i++) if (card[i] && card[i].code === code) return { ok: false, error: "Kerndoel " + code + " hangt al aan een ander boek." };
  var r = (reason || "").trim();
  if (r.length < PREFIX.trim().length + 8 || r === PREFIX.trim()) return { ok: false, error: "Maak de zin af: wat leert een kind met dit boek?" };
  var next = card.slice(); next[index] = { code: code, reason: r };
  return { ok: true, card: next };
}

function unmarkSquare(card, index) { var next = card.slice(); next[index] = null; return next; }

function findLines(card) { return LINES.filter(function (l) { return l.every(function (i) { return !!card[i]; }); }); }

function isFullCard(card) { return card.every(function (c) { return !!c; }); }

function domainsInLine(card, line) {
  var set = [];
  line.forEach(function (i) { var k = card[i] && kd(card[i].code); if (k && set.indexOf(k.domein) === -1) set.push(k.domein); });
  return set;
}
// LOGIC-END

/* ---------- opslag ---------- */
function load(key, fallback) {
  try { var raw = localStorage.getItem(key); if (raw) { var v = JSON.parse(raw); if (v && v.v === 1) return v; } } catch (e) {}
  return fallback();
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

/* ---------- kleine DOM-helper ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) return;
    if (k === "text") el.textContent = v;
    else if (k === "class") el.className = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c === null || c === undefined || c === false) continue;
    if (Array.isArray(c)) c.forEach(function (x) { if (x) el.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
    else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return el;
}
function svg(path) {
  var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "icoon"); s.setAttribute("aria-hidden", "true");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2.2");
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  s.innerHTML = path; return s;
}
var I = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/>',
  ball: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/>',
  copy: '<rect x="8" y="8" width="11" height="12" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/>'
};
function domLabel(d) { return h("span", { class: "dom d-" + d, text: d }); }
function announce(msg) { var l = document.getElementById("live"); l.textContent = ""; setTimeout(function () { l.textContent = msg; }, 30); }
function reducedMotion() { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

function openDialog(labelText, buildBody, opts) {
  opts = opts || {};
  var id = "d" + Math.random().toString(36).slice(2, 8);
  var dlg = h("dialog", { "aria-labelledby": id });
  var close = function () { dlg.close(); };
  var body = h("div", { class: "dlg" },
    h("div", { class: "dlg-kop" },
      h("h2", { id: id, text: labelText }),
      opts.noClose ? null : h("button", { class: "sluit", type: "button", "aria-label": "Sluiten", onclick: close }, svg(I.x))
    )
  );
  buildBody(body, close, dlg);
  dlg.appendChild(body);
  dlg.addEventListener("close", function () { dlg.remove(); if (opts.onClose) opts.onClose(); });
  if (opts.noEscape) dlg.addEventListener("cancel", function (e) { e.preventDefault(); });
  document.body.appendChild(dlg);
  dlg.showModal();
  return dlg;
}

function confirmInPage(title, text, yesLabel, onYes) {
  openDialog(title, function (b, close) {
    b.appendChild(h("p", { text: text }));
    b.appendChild(h("div", { class: "rij" },
      h("button", { class: "btn primair", type: "button", onclick: function () { close(); onYes(); } }, yesLabel),
      h("button", { class: "btn stil", type: "button", onclick: close }, "Annuleren")
    ));
  });
}

/* ================= TRAINER ================= */
var TKEY = "kdb-trainer-v1";
function newTrainer(pool) { return { v: 1, pool: (pool || STANDAARD_POOL).slice(), drawn: [], elapsed: 0, startedAt: null, running: false, winners: [], finished: false }; }
var T;
var rolling = null; // lopende animatie

function tElapsed() { return T.elapsed + (T.running && T.startedAt ? Date.now() - T.startedAt : 0); }
function mmss(ms) { var s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function tSave() { save(TKEY, T); }

function renderTrainer() {
  var app = document.getElementById("app"); app.innerHTML = "";
  var cur = T.drawn.length ? kd(T.drawn[T.drawn.length - 1]) : null;
  var done = T.drawn.length >= T.pool.length;

  var drawBtn = h("button", { class: "btn primair groot", type: "button", id: "trek", disabled: (done && !rolling) || T.finished, onclick: onDraw },

function onDraw() {
  if (rolling) { finishRoll(); return; }
  var res = drawBall(T.pool, T.drawn, Math.random);
  if (!res) return;
  if (!T.drawn.length) { T.running = true; T.startedAt = Date.now(); }
  T.drawn = res.drawn; tSave();
  if (reducedMotion()) { renderTrainer(); afterDraw(); return; }
  rolling = { t: null, end: Date.now() + 600 };
  renderTrainer();
  var codeEl = document.getElementById("balcode");
  if (codeEl) codeEl.classList.add("rolt");
  rolling.t = setInterval(function () {
    if (Date.now() >= rolling.end) { finishRoll(); return; }
    var el = document.getElementById("balcode");
    if (el) el.textContent = T.pool[Math.floor(Math.random() * T.pool.length)];
  }, 60);
  document.getElementById("trek").focus();
}
function finishRoll() { if (!rolling) return; clearInterval(rolling.t); rolling = null; renderTrainer(); afterDraw(); }
function afterDraw() {
  var k = kd(T.drawn[T.drawn.length - 1]);
  announce("Bal " + T.drawn.length + ": " + k.code + ", " + k.titel + ". " + k.doelzin);
  var b = document.getElementById("trek"); if (b && !b.disabled) b.focus();
}
function toggleTimer() {
  if (T.running) { T.elapsed = tElapsed(); T.running = false; T.startedAt = null; }
  else { T.running = true; T.startedAt = Date.now(); }
  tSave(); renderTrainer();
}

function bingoCheck(n) {
  var verdict = new Array(n).fill(null);
  openDialog(n === 9 ? "Volle kaart controleren" : "BINGO controleren", function (b, close) {
    b.appendChild(h("p", { class: "hulp", text: "Per boek 20 seconden. De zaal mag één vakje afkeuren; dan speelt het team door." }));
    var rows = h("div");

    var ok = h("button", { class: "btn primair", type: "button", disabled: true }, n === 9 ? "Volle kaart: winnaar noteren" : "Geldige bingo: winnaar noteren");
    function update() {
      var rej = verdict.indexOf("nee") !== -1, all = verdict.every(function (v) { return v === "ja"; });
      status.className = "status" + (rej ? " fout" : all ? " goed" : "");
      status.textContent = rej ? "Afgekeurd: het team speelt door." : all ? "Alle boeken goedgekeurd." : verdict.filter(Boolean).length + " van " + n + " beoordeeld.";
      ok.disabled = !(all && team.value.trim());

      ja.addEventListener("click", function () { set("ja"); });

      rows.appendChild(h("div", { class: "check-rij", role: "group", "aria-label": "Boek " + (i + 1) }, h("span", { text: "Boek " + (i + 1) }), ja, nee));
    })(i);
    team.addEventListener("input", update);

      var name = team.value.trim();

function markDialog(i) {

  openDialog("Welk kerndoel past bij “" + S.books[i] + "”?", function (b, close) {

    var list = h("div", { class: "kd-lijst", role: "radiogroup", "aria-label": "Kerndoelen" });

      var taken = used[k.code];

      r.addEventListener("change", function () { chosen = k.code; err.textContent = ""; });

        h("span", null, h("b", { text: k.code + " · " + k.titel }), h("br"), h("span", { class: "hulp", text: taken ? "Al gebruikt bij “" + taken + "”" : k.doelzin })));

    var det = h("details", null, h("summary", { text: "Overige kerndoelen Nederlands (als de trainer die gebruikt)" }));

function checkBingo(lastIndex) {
  var lines = findLines(S.card);
  if (isFullCard(S.card) && !S.fullShown) {
    S.fullShown = true; S.seenLines = lines.map(lineKey); sSave();
    resultScreen("VOLLE KAART", [0, 1, 2, 3, 4, 5, 6, 7, 8], lastIndex);
    return;
  }
  var fresh = lines.filter(function (l) { return S.seenLines.indexOf(lineKey(l)) === -1; });
  if (!fresh.length) return;
  S.seenLines = lines.map(lineKey); sSave();
  resultScreen("BINGO!", fresh[0], lastIndex);
}

function resultScreen(word, idx, lastIndex) {
  var doms = domainsInLine(S.card, idx);
  announce(word + " Lees jullie boeken voor.");
  var d = openDialog(word === "BINGO!" ? "Bingo! Roep het hardop" : "Volle kaart! Roep het hardop", function (b, close) {
    b.appendChild(h("p", { class: "bingo-kop", "aria-hidden": "true", text: word }));
    if (idx.length === 3) b.appendChild(h("p", { class: "status" + (doms.length === 3 ? " goed" : ""), text: doms.length === 3 ? "Samenhang: deze rij raakt alle drie de domeinen." : "Deze rij raakt " + doms.length + " van de 3 domeinen: " + doms.join(", ") + "." }));
    var ol = h("ol", { style: "display:grid;gap:10px;padding:0;margin:0;list-style:none" });
    idx.forEach(function (i) {
      var m = S.card[i], k = kd(m.code);
      ol.appendChild(h("li", { class: "bingo-boek" },
        h("span", { class: "bt", text: S.books[i] }),
        h("span", { class: "rij" }, h("b", { text: k.code + " · " + k.titel }), domLabel(k.domein)),
        h("span", { text: m.reason })));
    });
    b.appendChild(ol);
    b.appendChild(h("div", { class: "rij" }, h("button", { class: "btn primair", type: "button", onclick: close }, "Terug naar de kaart")));
  }, { onClose: function () { var v = document.getElementById("vak" + lastIndex); if (v) v.focus(); } });
  d.style.width = "min(900px, calc(100vw - 16px))";
}

function harvestText() {
  var lines = ["Kerndoelenbingo — " + S.team + " (" + (S.bouw === "ob" ? "onderbouw" : "bovenbouw") + ")", ""];
  DOMEINEN.forEach(function (d) {
    var items = [];
    S.card.forEach(function (m, i) { if (m && kd(m.code).domein === d) items.push("- " + S.books[i] + " → " + m.code + " " + kd(m.code).titel + ": " + m.reason); });
    lines.push(d + " (" + items.length + ")");
    lines = lines.concat(items.length ? items : ["- (nog niets)"]);
    lines.push("");
  });
  return lines.join("\n").trim();
}

function harvest() {
  openDialog("Onze oogst", function (b) {
    var ta = h("textarea", { class: "veld", id: "oogst", readonly: true, rows: "12", style: "min-height:260px" });
    ta.value = harvestText();
    var st = h("p", { class: "status", role: "status" });
    b.appendChild(h("p", { class: "hulp", text: "Per domein: welke boeken en wat een kind ervan leert. Materiaal voor de nabespreking." }));
    b.appendChild(h("div", null, h("label", { for: "oogst", text: "Oogst als tekst" }), ta));
    b.appendChild(h("div", { class: "rij" }, h("button", { class: "btn primair", type: "button", onclick: function () {
      var fallback = function () {
        ta.focus(); ta.select();
        var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
        st.className = "status" + (ok ? " goed" : "");
        st.textContent = ok ? "Gekopieerd." : "Tekst is geselecteerd: kopieer met Ctrl+C of lang indrukken.";
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ta.value).then(function () { st.className = "status goed"; st.textContent = "Gekopieerd."; }, fallback);
      else fallback();
    } }, svg(I.copy), "Kopieer")), st);
  });
}

/* ================= KEUZE + ROUTER ================= */
function renderChoice() {
  var app = document.getElementById("app"); app.innerHTML = "";
  app.appendChild(h("main", { class: "keuze", id: "inhoud", tabindex: "-1" },
    h("h1", { text: "Kerndoelenbingo" }),
    h("p", { text: "Kerndoelen Nederlands, primair onderwijs. Drie domeinen, negen ballen." }),
    h("div", { class: "rij" },
      h("a", { class: "btn primair groot", href: "#trainer" }, "Trainer (beamer)"),
      h("a", { class: "btn groot", href: "#team" }, "Team (telefoon)")
    )
  ));
}
function focusMain() { var m = document.getElementById("inhoud"); if (m) m.focus({ preventScroll: false }); }
var tick = null;
function route() {
  if (rolling) { clearInterval(rolling.t); rolling = null; }
  clearInterval(tick);
  var r = location.hash.replace("#", "");
  if (r === "trainer") {
    document.title = "Trainer · Kerndoelenbingo";
    T = load(TKEY, newTrainer);
    renderTrainer();
    tick = setInterval(function () { var k = document.getElementById("klok"); if (k) k.textContent = mmss(tElapsed()); }, 500);
  } else if (r === "team") {
    document.title = "Team · Kerndoelenbingo";
    S = load(KKEY, newTeam);
    renderTeam();
  } else { document.title = "Kerndoelenbingo"; renderChoice(); }
}
window.addEventListener("hashchange", function () { route(); focusMain(); });
route();
</script>
