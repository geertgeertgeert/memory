<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speelkaart · Kerndoelenbingo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* A3 liggend, vakken van precies 76 × 76 mm (standaard Post-it). Afdrukken op werkelijke grootte. */
@page { size: A3 landscape; margin: 0; }
:root { --paars: #92278F; --donker: #57257C; --blauw: #7598C0; --inkt: #1F1A24; --grijs: #5A5560; --lijn: #D9D4DE; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #FFFFFF; color: var(--inkt); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
.blad { width: 420mm; height: 297mm; padding: 10mm 12mm; margin: 0 auto; display: flex; flex-direction: column; gap: 5mm; background: #FFFFFF; }
header { height: 18mm; display: flex; justify-content: space-between; align-items: flex-end; gap: 10mm; }
h1 { margin: 0; font-size: 26pt; color: var(--donker); line-height: 1.05; }
header p { margin: 1mm 0 0; font-size: 12pt; }
.rechts { display: flex; flex-direction: column; align-items: flex-end; gap: 2mm; }
.team { font-weight: 700; font-size: 14pt; display: flex; gap: 3mm; align-items: flex-end; margin: 0; }
.team span { display: inline-block; width: 80mm; border-bottom: 2px solid var(--inkt); height: 8mm; }
.maat { font-size: 9pt; color: var(--grijs); display: flex; align-items: center; gap: 2mm; margin: 0; }
.maat i { display: inline-block; width: 50mm; height: 2.5mm; border: 1px solid var(--inkt); border-top: none; }
.rijen { display: flex; flex-direction: column; gap: 4mm; }
.rij { display: grid; grid-template-columns: 44mm repeat(3, minmax(0, 1fr)); gap: 5mm; height: 80mm; }
.rij h2 { margin: 0; font-size: 16pt; display: flex; flex-direction: column; justify-content: center; gap: 2.5mm; padding-left: 4mm; border-left: 3mm solid; }
.teken { width: 7mm; height: 7mm; display: inline-block; }
.vak { display: flex; gap: 3mm; align-items: stretch; }
.postit { flex: none; width: 76mm; height: 76mm; margin-top: 2mm; border: 0.7mm dashed; border-radius: 1.5mm; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2mm; text-align: center; color: var(--grijs); font-size: 10pt; padding: 4mm; }
.postit b { font-size: 11pt; color: var(--inkt); }
.boek { flex: 1 1 auto; min-width: 0; margin-top: 2mm; display: flex; flex-direction: column; gap: 6mm; font-size: 11pt; font-weight: 700; }
.boek span { border-bottom: 1.5px solid var(--grijs); height: 6mm; }
.C h2 { border-color: var(--paars); } .C .teken { background: var(--paars); border-radius: 1.2mm; } .C .postit { border-color: var(--paars); }
.L h2 { border-color: var(--blauw); } .L .teken { background: var(--blauw); transform: rotate(45deg) scale(.85); } .L .postit { border-color: var(--blauw); }
.T h2 { border-color: var(--donker); } .T .teken { background: var(--donker); border-radius: 50%; } .T .postit { border-color: var(--donker); }
.knop { position: fixed; right: 16px; bottom: 16px; min-height: 48px; padding: 8px 20px; border: none; border-radius: 10px; background: var(--paars); color: #FFFFFF; font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; }
.knop:focus-visible { outline: 3px solid #1D4ED8; outline-offset: 3px; }
@media print { .knop { display: none; } }
@media screen { body { background: #F6F3F8; padding: 16px 0; } .blad { box-shadow: 0 2px 12px rgba(31,26,36,.15); } }
</style>
</head>
<body>
<main class="blad">
  <header>
    <div>
      <h1>Kerndoelenbingo · speelkaart</h1>
      <p>Een bal past bij <b>elk</b> boek in zijn rij. Past een boek? Schrijf de code en je zin op een Post-it en plak hem op het vak.</p>
    </div>
    <div class="rechts">
      <p class="team">Team <span aria-hidden="true"></span></p>
      <p class="maat"><i aria-hidden="true"></i> controle: deze lijn is 5 cm (afdrukken op A3, werkelijke grootte)</p>
    </div>
  </header>
  <div class="rijen" id="rijen"></div>
</main>
<button class="knop" type="button" onclick="window.print()">Afdrukken</button>
<script>
  var vak = '<div class="vak"><div class="postit"><b>Plak hier je Post-it</b><span>code<br>+<br>“Een kind leert hiermee …”</span></div>' +
    '<div class="boek">Boek<span></span><span></span><span></span></div></div>';
  document.getElementById("rijen").innerHTML = [["C", "Communicatie"], ["L", "Literatuur"], ["T", "Taal"]].map(function (r) {
    return '<section class="rij ' + r[0] + '" aria-label="' + r[1] + '"><h2><span class="teken" aria-hidden="true"></span>' + r[1] + '</h2>' + vak + vak + vak + '</section>';
  }).join("");
</script>
</body>
</html>
