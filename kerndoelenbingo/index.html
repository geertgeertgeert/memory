<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerndoelenbingo</title>
<style>
:root{
  --paars:#92278F; --donker:#57257C; --blauw:#7598C0;
  --ink:#1d1530; --muted:#544b66; --line:#e2d9e8; --soft:#f8f3f8; --bg:#ffffff;
  --ok:#57257C; --nok:#3d3d3d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--paars);background:#fff;color:var(--donker);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600}
button.primary{background:var(--paars);color:#fff}
button.primary:hover:not(:disabled){background:var(--donker);border-color:var(--donker)}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{border-color:transparent;background:transparent}
:focus-visible{outline:3px solid var(--blauw);outline-offset:2px}
input[type=text],input[type=search],textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:#fff}
input:focus,textarea:focus{border-color:var(--paars)}
h1,h2,h3{margin:0;color:var(--donker);line-height:1.15}
.muted{color:var(--muted)}
.hidden{display:none!important}
.ph{display:inline-block;background:#fff3cd;color:#5c4300;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700}

/* keuzescherm */
.choose{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px 16px;text-align:center}
.choose h1{font-size:clamp(32px,6vw,56px);color:var(--paars)}
.choose .opts{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.choose a{display:flex;flex-direction:column;justify-content:center;width:min(280px,90vw);min-height:150px;border:3px solid var(--paars);border-radius:18px;text-decoration:none;color:var(--donker);font-size:26px;font-weight:700;padding:20px}
.choose a span{font-size:15px;font-weight:400;color:var(--muted);margin-top:6px}
.choose a:hover{background:var(--soft)}

/* trainer */
.t-wrap{min-height:100vh;display:flex;flex-direction:column}
.t-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.t-bar button{padding:8px 12px}
.t-bar .title{font-size:20px;font-weight:800;color:var(--paars);margin-right:auto}
.t-stat{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--donker);padding:0 6px}
.showbar{height:10px;background:var(--soft)}
.showbar>div{height:100%;width:0;background:var(--blauw)}
.t-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0}
.ball{padding:40px 48px;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:60vh}
.ball .code{font-size:clamp(44px,7vw,110px);font-weight:900;color:var(--paars);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.ball .titel{font-size:clamp(48px,4.6vw,84px);font-weight:800;color:var(--donker);line-height:1.08}
.ball .doel{font-size:clamp(22px,2.1vw,34px);color:var(--ink);max-width:40ch}
.ball .dom{font-size:20px;color:var(--muted);font-weight:600}
.ball.rolling .code{opacity:.75}
.ball .empty{font-size:clamp(36px,4vw,64px);color:var(--muted);font-weight:700}
.t-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 80px)}
.t-side h2{font-size:16px;text-transform:uppercase;letter-spacing:.06em;padding:14px 16px 6px}
.drawn{list-style:none;margin:0;padding:0 8px 8px;overflow:auto;flex:1}
.drawn li{display:flex;gap:10px;padding:6px 8px;border-radius:8px;font-size:16px}
.drawn li b{color:var(--paars);min-width:4.5em;font-variant-numeric:tabular-nums}
.drawn li.last{background:var(--soft)}
.drawn .n{color:var(--muted);min-width:1.6em;text-align:right}
.winners{list-style:none;margin:0;padding:0 16px 16px;max-height:34vh;overflow:auto}
.winners li{padding:8px 0;border-top:1px solid var(--line)}
.winners li strong{color:var(--donker);font-size:19px}
.settings{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:12px}
.settings fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 18px}
.settings label{display:flex;align-items:center;gap:8px;min-height:36px}
.settings input[type=checkbox]{width:20px;height:20px;accent-color:var(--paars)}
.settings input[type=number]{width:90px;border:2px solid var(--line);border-radius:8px;padding:6px 8px}
.linkbox{font-size:15px;word-break:break-all;background:var(--soft);padding:8px 10px;border-radius:8px}

/* modals */
.modal{position:fixed;inset:0;background:rgba(29,21,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:20;overflow:auto}
.panel{background:#fff;border-radius:18px;padding:24px;width:min(900px,100%);display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:30px}
.checkrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.checkrow .lbl{font-size:22px;font-weight:700;margin-right:auto;min-width:6em}
.checkrow button[aria-pressed=true].yes{background:var(--ok);border-color:var(--ok);color:#fff}
.checkrow button[aria-pressed=true].no{background:var(--nok);border-color:var(--nok);color:#fff}
.verdict{font-size:20px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.winnerscreen{position:fixed;inset:0;background:var(--paars);color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px}
.winnerscreen .big{font-size:clamp(40px,8vw,120px);font-weight:900;line-height:1}
.winnerscreen .team{font-size:clamp(32px,6vw,90px);font-weight:800}
.winnerscreen button{border-color:#fff;background:transparent;color:#fff}

/* team */
.m-wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.m-head{display:flex;align-items:center;gap:10px}
.m-head h1{font-size:22px;color:var(--paars);margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700}
.seg{display:flex;gap:8px}
.seg button{flex:1}
.seg button[aria-pressed=true]{background:var(--paars);color:#fff}
.bookgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bookgrid label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.bookgrid input{padding:8px;font-size:15px}
.card{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sq{aspect-ratio:1/1;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:left;font-weight:600;font-size:15px;overflow:hidden;min-height:0}
.sq .bt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;word-break:break-word}
.sq .kc{font-size:13px;font-weight:800}
.sq.on{background:var(--paars);border-color:var(--paars);color:#fff}
.sq.line{box-shadow:0 0 0 4px var(--blauw)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(29,21,48,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:#fff;width:min(560px,100%);max-height:88vh;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.klist{list-style:none;margin:0;padding:0;overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.klist button{width:100%;text-align:left;border-width:1px;border-color:var(--line);font-weight:500;display:flex;flex-direction:column;gap:2px}
.klist button b{color:var(--paars)}
.klist button small{color:var(--muted)}
.bingo{position:fixed;inset:0;z-index:30;background:#fff;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.bingo .shout{font-size:clamp(56px,18vw,120px);font-weight:900;color:var(--paars);line-height:1}
.bingo ol{list-style:none;margin:0;padding:0;width:min(560px,100%);display:flex;flex-direction:column;gap:12px}
.bingo li{border:2px solid var(--paars);border-radius:14px;padding:12px 14px}
.bingo li .b{font-size:24px;font-weight:800;color:var(--donker)}
.bingo li .k{font-size:18px}
.bingo li .k b{color:var(--paars)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--donker);color:#fff;padding:10px 16px;border-radius:10px;z-index:40;max-width:90vw}
textarea.oogst{min-height:40vh;font-family:inherit;font-size:15px}

@media (max-width:900px){
  .t-main{grid-template-columns:1fr}
  .t-side{border-left:0;border-top:1px solid var(--line);max-height:none}
  .ball{padding:24px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script id="data">
/* =====================================================================
   PLACEHOLDER-SET — VERVANGEN door de SLO kerndoelen PO 2025 (2e druk).
   Deze vijf items zijn GEEN echte kerndoelen. Structuur per item:
   { code, domein, titel, doelzin, bouw: ["ob","bb"] }
   Domeinen die met "Nederlands" beginnen tellen als Nederlands in de
   50/50-verdeling van de pool; de rest telt als wereldoriëntatie.
   ===================================================================== */
var KERNDOELEN = [
  { code: "PH-1", domein: "Nederlands – lezen", titel: "[Placeholder] Lezen", doelzin: "[Vervang door de SLO-doelzin]", bouw: ["ob","bb"], placeholder: true },
  { code: "PH-2", domein: "Mens & maatschappij", titel: "[Placeholder] Mens & maatschappij", doelzin: "[Vervang door de SLO-doelzin]", bouw: ["ob","bb"], placeholder: true },
  { code: "PH-3", domein: "Natuur & techniek", titel: "[Placeholder] Natuur & techniek", doelzin: "[Vervang door de SLO-doelzin]", bouw: ["ob","bb"], placeholder: true },
  { code: "PH-4", domein: "Burgerschap", titel: "[Placeholder] Burgerschap", doelzin: "[Vervang door de SLO-doelzin]", bouw: ["ob","bb"], placeholder: true },
  { code: "PH-5", domein: "Digitale geletterdheid", titel: "[Placeholder] Digitale geletterdheid", doelzin: "[Vervang door de SLO-doelzin]", bouw: ["ob","bb"], placeholder: true }
];
</script>

<script id="logic">
/* Pure spellogica: geen DOM, geen opslag. Getest met tests/logic.test.js. */
var BingoLogic = (function () {
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function isNederlands(k) { return /^nederlands/i.test(k.domein); }

  /* Pool van `size` codes uit de gekozen domeinen, ~helft Nederlands, ~helft WO. */
  function buildPool(all, domeinen, size, rng) {
    rng = rng || Math.random;
    var pick = all.filter(function (k) { return domeinen.indexOf(k.domein) >= 0; });
    var ned = shuffle(pick.filter(isNederlands), rng);
    var wo = shuffle(pick.filter(function (k) { return !isNederlands(k); }), rng);
    var half = Math.ceil(size / 2);
    var out = ned.slice(0, half).concat(wo.slice(0, size - half));
    var rest = shuffle(ned.slice(half).concat(wo.slice(size - half)), rng);
    while (out.length < size && rest.length) out.push(rest.shift());
    return shuffle(out, rng).map(function (k) { return k.code; });
  }

  /* Trek een bal uit de nog niet getrokken pool. Geeft nieuwe state terug. */
  function drawBall(state, rng) {
    rng = rng || Math.random;
    var left = state.pool.filter(function (c) { return state.drawn.indexOf(c) < 0; });
    if (!left.length) return { state: state, ball: null };
    var ball = left[Math.floor(rng() * left.length)];
    var next = Object.assign({}, state, { drawn: state.drawn.concat([ball]), current: ball });
    return { state: next, ball: ball };
  }

  /* Markeer vakje idx (0..8) met kerndoel code. Eén boek = één kerndoel, één kerndoel = één boek. */
  function markSquare(marks, idx, code) {
    if (!(idx >= 0 && idx < 9) || Math.floor(idx) !== idx) return { ok: false, marks: marks, error: "Ongeldig vakje." };
    if (!code) return { ok: false, marks: marks, error: "Kies een kerndoel." };
    if (marks[idx] && marks[idx] !== code) return { ok: false, marks: marks, error: "Dit boek is al gebruikt. Draai het eerst terug." };
    var other = marks.findIndex(function (m, i) { return m === code && i !== idx; });
    if (other >= 0) return { ok: false, marks: marks, error: "Dit kerndoel hangt al aan een ander boek.", conflict: other };
    var copy = marks.slice(); copy[idx] = code;
    return { ok: true, marks: copy };
  }

  function unmarkSquare(marks, idx) { var copy = marks.slice(); copy[idx] = null; return copy; }

  /* Alle volle rijen, kolommen en diagonalen. */
  function findLines(marks) {
    return LINES.filter(function (l) { return l.every(function (i) { return !!marks[i]; }); });
  }

  function isFullCard(marks) {
    return marks.length === 9 && marks.every(function (m) { return !!m; });
  }

  return { LINES: LINES, shuffle: shuffle, buildPool: buildPool, drawBall: drawBall,
           markSquare: markSquare, unmarkSquare: unmarkSquare, findLines: findLines, isFullCard: isFullCard };
})();
if (typeof module !== "undefined") module.exports = BingoLogic;
</script>

<script id="ui">
(function () {
  var L = BingoLogic;
  var SHOW_MS = 25000;
  var app = document.getElementById("app");
  var KD = {}; KERNDOELEN.forEach(function (k) { KD[k.code] = k; });
  var DOMEINEN = []; KERNDOELEN.forEach(function (k) { if (DOMEINEN.indexOf(k.domein) < 0) DOMEINEN.push(k.domein); });
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function load(key) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  function mmss(ms) { var s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  function toast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }
  var hasPlaceholders = KERNDOELEN.some(function (k) { return k.placeholder; });
  var phBadge = hasPlaceholders ? '<span class="ph">Placeholder-kerndoelen</span>' : "";
  var gear = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

  /* ================================ TRAINER ================================ */
  var TKEY = "kdb-trainer-v1";
  function newTrainer(settings) {
    settings = settings || { domeinen: DOMEINEN.slice(), size: 24 };
    return { pool: L.buildPool(KERNDOELEN, settings.domeinen, settings.size), drawn: [], current: null,
             settings: settings, clock: { acc: 0, startedAt: null }, show: { on: false, nextAt: null, remaining: null },
             winners: [], ended: false };
  }
  var T = null;
  var tui = { settings: false, modal: null, check: null, rolling: false, winnerScreen: null, confirm: false };
  var tick = null;

  function clockRunning() { return T.clock.startedAt != null; }
  function elapsed() { return T.clock.acc + (clockRunning() ? Date.now() - T.clock.startedAt : 0); }
  function saveT() { save(TKEY, T); }

  function trainerDraw() {
    if (T.ended) return;
    var r = L.drawBall(T);
    if (!r.ball) { toast("Alle ballen zijn getrokken."); T.show.on = false; saveT(); renderTrainer(); return; }
    T = r.state;
    if (!clockRunning() && T.drawn.length === 1) T.clock.startedAt = Date.now();
    if (T.show.on && clockRunning()) T.show.nextAt = Date.now() + SHOW_MS;
    saveT();
    if (reduceMotion) { renderTrainer(); return; }
    tui.rolling = true; renderTrainer();
    var el = document.querySelector(".ball .code"); var n = 0;
    var spin = setInterval(function () {
      n++; var p = T.pool[Math.floor(Math.random() * T.pool.length)];
      if (el) el.textContent = p;
      if (n >= 9 || !tui.rolling) { clearInterval(spin); tui.rolling = false; renderTrainer(); }
    }, 70);
  }
  function togglePause() {
    if (clockRunning()) {
      T.clock.acc += Date.now() - T.clock.startedAt; T.clock.startedAt = null;
      if (T.show.on && T.show.nextAt) { T.show.remaining = Math.max(0, T.show.nextAt - Date.now()); T.show.nextAt = null; }
    } else {
      T.clock.startedAt = Date.now();
      if (T.show.on) { T.show.nextAt = Date.now() + (T.show.remaining != null ? T.show.remaining : SHOW_MS); T.show.remaining = null; }
    }
    saveT(); renderTrainer();
  }
  function toggleShow() {
    T.show.on = !T.show.on;
    if (T.show.on) {
      if (!T.drawn.length) { trainerDraw(); }
      else if (clockRunning()) { T.show.nextAt = Date.now() + SHOW_MS; }
      else { T.show.remaining = SHOW_MS; }
    } else { T.show.nextAt = null; T.show.remaining = null; }
    saveT(); renderTrainer();
  }
  function onTick() {
    if (!T || location.hash !== "#trainer") return;
    var c = document.getElementById("clock"); if (c) c.textContent = mmss(elapsed());
    var fill = document.getElementById("showfill");
    if (T.show.on && T.show.nextAt && clockRunning() && !T.ended) {
      var left = T.show.nextAt - Date.now();
      if (fill) fill.style.width = (100 * (1 - left / SHOW_MS)).toFixed(1) + "%";
      var lbl = document.getElementById("showleft"); if (lbl) lbl.textContent = Math.ceil(Math.max(0, left) / 1000) + " s";
      if (left <= 0 && !tui.modal && !tui.winnerScreen) trainerDraw();
    } else if (fill) {
      fill.style.width = T.show.on && T.show.remaining != null ? (100 * (1 - T.show.remaining / SHOW_MS)).toFixed(1) + "%" : "0%";
    }
  }

  function openCheck(kind) {
    var n = kind === "full" ? 9 : 3;
    tui.modal = "check";
    tui.check = { kind: kind, rows: new Array(n).fill(null), team: "", note: "" };
    renderTrainer();
    var first = document.querySelector(".panel button"); if (first) first.focus();
  }
  function checkState() {
    var c = tui.check;
    var rejected = c.rows.some(function (r) { return r === false; });
    var allOk = c.rows.every(function (r) { return r === true; });
    return { rejected: rejected, allOk: allOk, canSave: allOk && c.team.trim().length > 0 };
  }
  function updateCheckUI() {
    var s = checkState();
    var b = document.getElementById("savewinner"); if (b) b.disabled = !s.canSave;
    var v = document.getElementById("verdict");
    if (v) v.textContent = s.rejected ? "Afgekeurd: dit team speelt door." : s.allOk ? "Alles goedgekeurd. Vul de teamnaam in." : "Beoordeel elk boek.";
  }
  function saveWinner() {
    var c = tui.check; if (!checkState().canSave) return;
    T.winners.push({ type: c.kind, team: c.team.trim(), note: c.note.trim(), time: mmss(elapsed()), bal: T.drawn.length });
    if (c.kind === "full") {
      T.ended = true; T.show.on = false; T.show.nextAt = null;
      if (clockRunning()) { T.clock.acc += Date.now() - T.clock.startedAt; T.clock.startedAt = null; }
      tui.winnerScreen = c.team.trim();
    }
    tui.modal = null; tui.check = null; saveT(); renderTrainer();
  }

  function renderTrainer() {
    var total = T.pool.length, cur = T.current ? KD[T.current] : null;
    var running = clockRunning();
    var h = '<div class="t-wrap">';
    h += '<header class="t-bar"><span class="title">Kerndoelenbingo ' + phBadge + '</span>';
    h += '<span class="t-stat" aria-live="polite">Bal ' + T.drawn.length + ' van ' + total + '</span>';
    h += '<span class="t-stat" id="clock" aria-label="Speeltijd">' + mmss(elapsed()) + '</span>';
    h += '<button class="primary" data-a="draw" ' + (T.ended || T.drawn.length >= total ? "disabled" : "") + '>Trek een bal</button>';
    h += '<button data-a="show" aria-pressed="' + T.show.on + '">Showmodus: ' + (T.show.on ? 'aan <span id="showleft"></span>' : "uit") + '</button>';
    h += '<button data-a="pause" ' + (!T.drawn.length || T.ended ? "disabled" : "") + '>' + (running ? "Pauze" : "Hervat") + '</button>';
    h += '<button data-a="bingo" ' + (T.ended ? "disabled" : "") + '>BINGO-check</button>';
    h += '<button data-a="full" ' + (T.ended ? "disabled" : "") + '>Volle kaart</button>';
    h += '<button class="ghost" data-a="settings" aria-expanded="' + tui.settings + '" aria-label="Instellingen">' + gear + '</button>';
    h += '</header>';
    h += '<div class="showbar" aria-hidden="true"><div id="showfill"></div></div>';
    if (tui.settings) h += renderSettings();
    h += '<div class="t-main"><section class="ball' + (tui.rolling ? " rolling" : "") + '" aria-live="polite">';
    if (tui.rolling) h += '<div class="code">…</div><div class="dom">Trekking… <button class="ghost" data-a="skip">Overslaan</button></div>';
    else if (cur) h += '<div class="dom">' + esc(cur.domein) + '</div><div class="code">' + esc(cur.code) + '</div><div class="titel">' + esc(cur.titel) + '</div><div class="doel">' + esc(cur.doelzin) + '</div>';
    else if (T.current) h += '<div class="code">' + esc(T.current) + '</div>';
    else h += '<div class="empty">Klaar voor de eerste bal.</div><div class="muted" style="font-size:20px">Teams: open de teamlink (tandwiel) en vul jullie negen boeken in.</div>';
    h += '</section><aside class="t-side"><h2>Getrokken</h2><ol class="drawn" id="drawn">';
    T.drawn.forEach(function (c, i) {
      var k = KD[c];
      h += '<li class="' + (i === T.drawn.length - 1 ? "last" : "") + '"><span class="n">' + (i + 1) + '</span><b>' + esc(c) + '</b><span>' + esc(k ? k.titel : "") + '</span></li>';
    });
    if (!T.drawn.length) h += '<li class="muted">Nog geen ballen.</li>';
    h += '</ol><h2>Winnaars</h2><ul class="winners">';
    T.winners.forEach(function (w) {
      h += '<li><strong>' + esc(w.team) + '</strong> · ' + (w.type === "full" ? "Volle kaart" : "Bingo") + ' · ' + esc(w.time) + (w.note ? '<div class="muted">' + esc(w.note) + '</div>' : "") + '</li>';
    });
    if (!T.winners.length) h += '<li class="muted" style="border:0">Nog geen winnaars.</li>';
    h += '</ul></aside></div></div>';
    if (tui.modal === "check") h += renderCheck();
    if (tui.winnerScreen) h += '<div class="winnerscreen" role="dialog" aria-modal="true" aria-label="Winnaar"><div class="big">VOLLE KAART</div><div class="team">' + esc(tui.winnerScreen) + '</div><div style="font-size:24px">Winnaar van de middag</div><button data-a="closewinner">Sluiten</button></div>';
    app.innerHTML = h;
    var d = document.getElementById("drawn"); if (d) d.scrollTop = d.scrollHeight;
    onTick();
  }
  function renderSettings() {
    var link = location.href.split("#")[0] + "#team";
    var h = '<section class="settings" aria-label="Instellingen"><fieldset><legend>Domeinen in de pool</legend>';
    DOMEINEN.forEach(function (d, i) {
      h += '<label><input type="checkbox" data-dom="' + i + '" ' + (tui.pendDom.indexOf(d) >= 0 ? "checked" : "") + '> ' + esc(d) + '</label>';
    });
    h += '</fieldset><label>Poolformaat <input type="number" id="poolsize" min="3" max="200" value="' + tui.pendSize + '"> <span class="muted">(beschikbaar: ' + KERNDOELEN.length + ')</span></label>';
    if (tui.confirm) h += '<div class="row"><strong>Huidig spel wissen en een nieuw spel starten?</strong><button class="primary" data-a="newyes">Ja, nieuw spel</button><button data-a="newno">Annuleren</button></div>';
    else h += '<div class="row"><button data-a="newgame">Nieuw spel (met deze instellingen)</button></div>';
    h += '<div><div class="muted">Teamlink:</div><div class="linkbox">' + esc(link) + '</div></div></section>';
    return h;
  }
  function renderCheck() {
    var c = tui.check, s = checkState();
    var h = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="chk-t"><div class="panel">';
    h += '<h2 id="chk-t">' + (c.kind === "full" ? "Volle kaart-check" : "BINGO-check") + '</h2><p class="muted" style="margin:0">20 seconden per boek: welke kennis of vaardigheid bouwt een kind hiermee op richting dit kerndoel?</p>';
    c.rows.forEach(function (r, i) {
      h += '<div class="checkrow"><span class="lbl">Boek ' + (i + 1) + '</span>';
      h += '<button class="yes" data-a="ok" data-i="' + i + '" aria-pressed="' + (r === true) + '">Goedgekeurd</button>';
      h += '<button class="no" data-a="nok" data-i="' + i + '" aria-pressed="' + (r === false) + '">Afgekeurd</button></div>';
    });
    h += '<div class="verdict" id="verdict" aria-live="polite"></div>';
    h += '<label class="field"><span>Teamnaam</span><input type="text" id="chkteam" value="' + esc(c.team) + '" autocomplete="off"></label>';
    h += '<label class="field"><span>Notitie (onderbouwingen, voor de nabespreking)</span><textarea id="chknote" rows="3">' + esc(c.note) + '</textarea></label>';
    h += '<div class="row"><button class="primary" id="savewinner" data-a="savewinner" ' + (s.canSave ? "" : "disabled") + '>' + (c.kind === "full" ? "Geldige volle kaart: winnaar!" : "Geldige bingo: winnaar noteren") + '</button>';
    h += '<button data-a="closecheck">' + (s.rejected ? "Sluiten: team speelt door" : "Annuleren") + '</button></div></div></div>';
    setTimeout(updateCheckUI, 0);
    return h;
  }

  function trainerClick(e) {
    var b = e.target.closest("[data-a]"); if (!b) return;
    var a = b.getAttribute("data-a"), i = +b.getAttribute("data-i");
    if (a === "draw") trainerDraw();
    else if (a === "skip") tui.rolling = false;
    else if (a === "show") toggleShow();
    else if (a === "pause") togglePause();
    else if (a === "bingo") openCheck("bingo");
    else if (a === "full") openCheck("full");
    else if (a === "settings") { tui.settings = !tui.settings; tui.confirm = false; tui.pendDom = T.settings.domeinen.slice(); tui.pendSize = T.settings.size; renderTrainer(); }
    else if (a === "ok" || a === "nok") { tui.check.rows[i] = a === "ok"; renderTrainer(); var nb = document.querySelector('[data-a="' + a + '"][data-i="' + i + '"]'); if (nb) nb.focus(); }
    else if (a === "closecheck") { tui.modal = null; tui.check = null; renderTrainer(); }
    else if (a === "savewinner") saveWinner();
    else if (a === "closewinner") { tui.winnerScreen = null; renderTrainer(); }
    else if (a === "newgame") { tui.confirm = true; renderTrainer(); }
    else if (a === "newno") { tui.confirm = false; renderTrainer(); }
    else if (a === "newyes") {
      var doms = tui.pendDom.length ? tui.pendDom.slice() : DOMEINEN.slice();
      var size = Math.max(3, Math.min(200, parseInt(tui.pendSize, 10) || 24));
      T = newTrainer({ domeinen: doms, size: size }); tui.confirm = false; tui.settings = false; tui.winnerScreen = null;
      saveT(); renderTrainer(); toast("Nieuw spel: " + T.pool.length + " ballen in de pool.");
    }
  }
  function trainerInput(e) {
    var t = e.target;
    if (t.id === "chkteam") { tui.check.team = t.value; updateCheckUI(); }
    else if (t.id === "chknote") { tui.check.note = t.value; }
    else if (t.id === "poolsize") { tui.pendSize = t.value; }
    else if (t.hasAttribute("data-dom")) {
      var d = DOMEINEN[+t.getAttribute("data-dom")];
      tui.pendDom = tui.pendDom.filter(function (x) { return x !== d; }); if (t.checked) tui.pendDom.push(d);
    }
  }

  function startTrainer() {
    T = load(TKEY);
    if (!T || !Array.isArray(T.pool) || !Array.isArray(T.drawn)) { T = newTrainer(); saveT(); }
    tui.pendDom = T.settings.domeinen.slice(); tui.pendSize = T.settings.size;
    renderTrainer();
    if (!tick) tick = setInterval(onTick, 200);
  }

  /* ================================ TEAM ================================ */
  var MKEY = "kdb-team-v1";
  function newTeam() { return { step: 1, name: "", bouw: "", books: ["","","","","","","","",""], marks: [null,null,null,null,null,null,null,null,null], seen: [], fullSeen: false }; }
  var S = null;
  var mui = { picker: null, q: "", overlay: null, lines: [], confirm: false };
  function saveS() { save(MKEY, S); }
  function lineKey(l) { return l.join("-"); }
  function codeLabel(code) { var k = KD[code]; return k ? k.titel : ""; }

  function afterMark() {
    var lines = L.findLines(S.marks), keys = lines.map(lineKey);
    var fresh = lines.filter(function (l) { return S.seen.indexOf(lineKey(l)) < 0; });
    S.seen = keys;
    if (L.isFullCard(S.marks)) {
      if (!S.fullSeen) { S.fullSeen = true; mui.overlay = "full"; }
    } else {
      S.fullSeen = false;
      if (fresh.length) { mui.overlay = "bingo"; mui.lines = fresh; }
    }
    saveS();
  }

  function renderTeam() {
    var h = '<div class="m-wrap">';
    h += '<div class="m-head"><h1>' + (S.name ? esc(S.name) : "Kerndoelenbingo") + '</h1>' + phBadge + '</div>';
    if (S.step === 1) {
      h += '<h2>Stap 1 · Jullie team</h2>';
      h += '<label class="field"><span>Teamnaam</span><input type="text" id="tname" value="' + esc(S.name) + '" autocomplete="off" enterkeyhint="next"></label>';
      h += '<div class="field"><span id="bouwlbl">Bouw</span><div class="seg" role="group" aria-labelledby="bouwlbl">';
      h += '<button data-a="bouw" data-v="ob" aria-pressed="' + (S.bouw === "ob") + '">Onderbouw</button><button data-a="bouw" data-v="bb" aria-pressed="' + (S.bouw === "bb") + '">Bovenbouw</button></div></div>';
      h += '<button class="primary" id="next1" data-a="next1" ' + (S.name.trim() && S.bouw ? "" : "disabled") + '>Verder</button>';
    } else if (S.step === 2) {
      h += '<h2>Stap 2 · Jullie negen boeken</h2><p class="muted" style="margin:0">Zoals ze op tafel liggen. Korte titel is genoeg. Enter = volgend vak.</p><div class="bookgrid">';
      S.books.forEach(function (b, i) {
        h += '<label>Vak ' + (i + 1) + '<input type="text" data-book="' + i + '" value="' + esc(b) + '" autocomplete="off" enterkeyhint="' + (i < 8 ? "next" : "done") + '"></label>';
      });
      h += '</div><div class="row"><button data-a="back1">Terug</button><button class="primary" id="start" data-a="start" ' + (S.books.every(function (b) { return b.trim(); }) ? "" : "disabled") + '>Start het spel</button></div>';
    } else {
      var inLine = {}; L.findLines(S.marks).forEach(function (l) { l.forEach(function (i) { inLine[i] = true; }); });
      var nMarked = S.marks.filter(Boolean).length;
      h += '<p class="muted" style="margin:0">Tik op een boek als een getrokken kerndoel erbij past. ' + nMarked + ' van 9 gemarkeerd.</p><div class="card">';
      S.books.forEach(function (b, i) {
        var m = S.marks[i];
        h += '<button class="sq' + (m ? " on" : "") + (inLine[i] ? " line" : "") + '" data-a="sq" data-i="' + i + '" aria-label="' + esc(b) + (m ? ", gemarkeerd met " + esc(m) : ", niet gemarkeerd") + '"><span class="bt">' + esc(b) + '</span><span class="kc">' + (m ? esc(m) : "") + '</span></button>';
      });
      h += '</div><div class="row">';
      if (L.findLines(S.marks).length) h += '<button class="primary" data-a="showbingo">Toon bingo</button>';
      h += '<button data-a="oogst">Onze oogst</button>';
      h += mui.confirm ? '<span><strong>Alles wissen?</strong> <button data-a="resetyes">Ja, nieuw spel</button> <button data-a="resetno">Nee</button></span>' : '<button class="ghost" data-a="reset">Nieuw spel</button>';
      h += '</div>';
    }
    h += '</div>';
    if (mui.picker != null) h += renderPicker();
    if (mui.overlay === "bingo" || mui.overlay === "full") h += renderBingo();
    if (mui.overlay === "oogst") h += renderOogst();
    app.innerHTML = h;
  }

  function pickerItems() {
    var q = mui.q.trim().toLowerCase();
    var list = KERNDOELEN.filter(function (k) {
      return !q || (k.code + " " + k.titel + " " + k.doelzin + " " + k.domein).toLowerCase().indexOf(q) >= 0;
    });
    var bouw = S.bouw;
    return list.slice().sort(function (a, b) {
      var A = a.bouw && a.bouw.indexOf(bouw) >= 0 ? 0 : 1, B = b.bouw && b.bouw.indexOf(bouw) >= 0 ? 0 : 1;
      return A - B;
    });
  }
  function renderPickerList() {
    var idx = mui.picker, h = "";
    pickerItems().forEach(function (k) {
      var usedAt = S.marks.indexOf(k.code), used = usedAt >= 0 && usedAt !== idx;
      h += '<li><button data-a="pick" data-code="' + esc(k.code) + '" ' + (used ? "disabled" : "") + '><b>' + esc(k.code) + ' · ' + esc(k.titel) + '</b><small>' + (used ? "Al gebruikt bij: " + esc(S.books[usedAt]) : esc(k.domein)) + '</small></button></li>';
    });
    return h || '<li class="muted">Geen kerndoel gevonden.</li>';
  }
  function renderPicker() {
    var idx = mui.picker, m = S.marks[idx];
    var h = '<div class="sheet" data-a="closepicker"><div class="inner" role="dialog" aria-modal="true" aria-labelledby="pk-t">';
    h += '<div class="row"><h2 id="pk-t" style="font-size:20px;margin-right:auto">' + esc(S.books[idx]) + '</h2><button class="ghost" data-a="closepicker" aria-label="Sluiten">Sluiten</button></div>';
    if (m) {
      h += '<p style="margin:0">Gemarkeerd met <b>' + esc(m) + '</b> ' + esc(codeLabel(m)) + '</p><div class="row"><button class="primary" data-a="unmark">Terugdraaien</button></div>';
    } else {
      h += '<label class="field"><span>Welk kerndoel past hierbij?</span><input type="search" id="kq" value="' + esc(mui.q) + '" placeholder="Zoek op code of woord" autocomplete="off"></label>';
      h += '<ul class="klist" id="klist">' + renderPickerList() + '</ul>';
    }
    return h + '</div></div>';
  }
  function renderBingo() {
    var full = mui.overlay === "full";
    var idxs = full ? [0,1,2,3,4,5,6,7,8] : [];
    if (!full) mui.lines.forEach(function (l) { l.forEach(function (i) { if (idxs.indexOf(i) < 0) idxs.push(i); }); });
    var h = '<div class="bingo" role="dialog" aria-modal="true" aria-labelledby="bg-t"><div class="shout" id="bg-t">' + (full ? "VOLLE KAART!" : "BINGO!") + '</div>';
    h += '<p style="margin:0;font-size:18px">Roep het hardop. Vertel per boek: wat leert een kind ervan?</p><ol>';
    idxs.forEach(function (i) {
      h += '<li><div class="b">' + esc(S.books[i]) + '</div><div class="k"><b>' + esc(S.marks[i]) + '</b> ' + esc(codeLabel(S.marks[i])) + '</div></li>';
    });
    return h + '</ol><button class="primary" data-a="closebingo">Terug naar de kaart</button></div>';
  }
  function oogstText() {
    var lines = ["Kerndoelenbingo · " + S.name + " (" + (S.bouw === "ob" ? "onderbouw" : "bovenbouw") + ")", ""];
    S.books.forEach(function (b, i) { var m = S.marks[i]; if (m) lines.push(b + " → " + m + " " + codeLabel(m)); });
    if (lines.length === 2) lines.push("(nog niets gemarkeerd)");
    return lines.join("\n");
  }
  function renderOogst() {
    return '<div class="bingo" role="dialog" aria-modal="true" aria-labelledby="og-t"><h2 id="og-t" style="font-size:28px">Onze oogst</h2>' +
      '<textarea class="oogst" id="oogsttxt" readonly style="width:min(560px,100%)">' + esc(oogstText()) + '</textarea>' +
      '<div class="row"><button class="primary" data-a="copy">Kopieer</button><button data-a="closebingo">Terug naar de kaart</button></div></div>';
  }

  function teamClick(e) {
    var b = e.target.closest("[data-a]"); if (!b) return;
    var a = b.getAttribute("data-a");
    if (a === "closepicker" && e.target !== b && b.classList.contains("sheet")) return; // klik binnen sheet
    var i = +b.getAttribute("data-i");
    if (a === "bouw") { S.bouw = b.getAttribute("data-v"); saveS(); renderTeam(); }
    else if (a === "next1") { if (S.name.trim() && S.bouw) { S.step = 2; saveS(); renderTeam(); var f = document.querySelector("[data-book]"); if (f) f.focus(); } }
    else if (a === "back1") { S.step = 1; saveS(); renderTeam(); }
    else if (a === "start") { if (S.books.every(function (x) { return x.trim(); })) { S.books = S.books.map(function (x) { return x.trim(); }); S.step = 3; saveS(); renderTeam(); } }
    else if (a === "sq") { mui.picker = i; mui.q = ""; renderTeam(); var q = document.getElementById("kq"); if (q) q.focus(); }
    else if (a === "closepicker") { mui.picker = null; renderTeam(); }
    else if (a === "pick") {
      var r = L.markSquare(S.marks, mui.picker, b.getAttribute("data-code"));
      if (!r.ok) { toast(r.error); return; }
      S.marks = r.marks; mui.picker = null; afterMark(); renderTeam();
    }
    else if (a === "unmark") { S.marks = L.unmarkSquare(S.marks, mui.picker); mui.picker = null; afterMark(); renderTeam(); }
    else if (a === "showbingo") {
      if (L.isFullCard(S.marks)) mui.overlay = "full"; else { mui.overlay = "bingo"; mui.lines = L.findLines(S.marks); }
      renderTeam();
    }
    else if (a === "closebingo") { mui.overlay = null; renderTeam(); }
    else if (a === "oogst") { mui.overlay = "oogst"; renderTeam(); }
    else if (a === "copy") {
      var ta = document.getElementById("oogsttxt"), txt = oogstText();
      var fallback = function () { ta.focus(); ta.select(); try { document.execCommand("copy"); toast("Gekopieerd."); } catch (err) { toast("Tekst geselecteerd: kopieer met je telefoon."); } };
      try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function () { toast("Gekopieerd."); }, fallback); else fallback(); } catch (err) { fallback(); }
    }
    else if (a === "reset") { mui.confirm = true; renderTeam(); }
    else if (a === "resetno") { mui.confirm = false; renderTeam(); }
    else if (a === "resetyes") { S = newTeam(); mui = { picker: null, q: "", overlay: null, lines: [], confirm: false }; saveS(); renderTeam(); }
  }
  function teamInput(e) {
    var t = e.target;
    if (t.id === "tname") { S.name = t.value; saveS(); var n = document.getElementById("next1"); if (n) n.disabled = !(S.name.trim() && S.bouw); }
    else if (t.hasAttribute("data-book")) { S.books[+t.getAttribute("data-book")] = t.value; saveS(); var s = document.getElementById("start"); if (s) s.disabled = !S.books.every(function (b) { return b.trim(); }); }
    else if (t.id === "kq") { mui.q = t.value; var l = document.getElementById("klist"); if (l) l.innerHTML = renderPickerList(); }
  }
  function teamKey(e) {
    var t = e.target;
    if (e.key === "Escape" && (mui.picker != null || mui.overlay)) { mui.picker = null; mui.overlay = null; renderTeam(); return; }
    if (e.key !== "Enter") return;
    if (t.id === "tname") { e.preventDefault(); var ob = document.querySelector('[data-a="bouw"]'); if (S.bouw) document.getElementById("next1").click(); else if (ob) ob.focus(); }
    else if (t.hasAttribute("data-book")) {
      e.preventDefault(); var i = +t.getAttribute("data-book");
      if (i < 8) document.querySelector('[data-book="' + (i + 1) + '"]').focus();
      else { var first = S.books.findIndex(function (b) { return !b.trim(); }); if (first >= 0) document.querySelector('[data-book="' + first + '"]').focus(); else document.getElementById("start").click(); }
    }
  }
  function startTeam() {
    S = load(MKEY);
    if (!S || !Array.isArray(S.books) || S.books.length !== 9) { S = newTeam(); saveS(); }
    renderTeam();
  }

  /* ================================ ROUTER ================================ */
  function route() {
    var hsh = location.hash;
    if (hsh === "#trainer") { document.title = "Kerndoelenbingo · trainer"; startTrainer(); }
    else if (hsh === "#team") { document.title = "Kerndoelenbingo · team"; startTeam(); }
    else {
      document.title = "Kerndoelenbingo";
      app.innerHTML = '<main class="choose"><h1>Kerndoelenbingo</h1>' + phBadge + '<div class="opts"><a href="#trainer">Trainer<span>Beamerscherm: ballen trekken</span></a><a href="#team">Team<span>Telefoon: jullie kaart</span></a></div></main>';
    }
  }
  app.addEventListener("click", function (e) { if (location.hash === "#trainer") trainerClick(e); else if (location.hash === "#team") teamClick(e); });
  app.addEventListener("input", function (e) { if (location.hash === "#trainer") trainerInput(e); else if (location.hash === "#team") teamInput(e); });
  app.addEventListener("change", function (e) { if (location.hash === "#trainer") trainerInput(e); });
  document.addEventListener("keydown", function (e) {
    if (location.hash === "#team") teamKey(e);
    else if (location.hash === "#trainer" && e.key === "Escape" && tui.modal) { tui.modal = null; tui.check = null; renderTrainer(); }
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
